<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mes Projets - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <span class="brand">TaskFlow</span>
    <div style="display:flex;align-items:center;gap:.5rem">
      <span id="user-display"></span>
      <a href="index.html">Tableau de bord</a>
      <div class="notif-wrapper">
        <button class="notif-bell" onclick="toggleNotifDropdown()" aria-label="Notifications">🔔<span id="notif-badge"></span></button>
        <div id="notif-dropdown" style="display:none"><div id="notif-list"></div></div>
      </div>
      <button id="logout-btn">Déconnexion</button>
    </div>
  </nav>

  <div class="section">
    <div class="flex-between" style="margin-bottom:1.2rem">
      <h1 style="color:var(--light)">Mes Projets</h1>
      <button onclick="openModal()">+ Nouveau Projet</button>
    </div>
    <div id="projects-list"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="project-modal">
    <div class="modal-content">
      <h2 id="modal-title">Nouveau Projet</h2>
      <form id="project-form">
        <input type="hidden" id="project-id">
        <input type="text" id="title" placeholder="Titre du projet" required>
        <textarea id="description" placeholder="Description" rows="3"></textarea>
        <input type="date" id="deadline">
        <select id="status">
          <option value="actif">Actif</option>
          <option value="en pause">En pause</option>
          <option value="archivé">Archivé</option>
        </select>
        <div style="display:flex;gap:.7rem;margin-top:.5rem">
          <button type="submit">Enregistrer</button>
          <button type="button" class="btn-danger" onclick="closeModal()">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
