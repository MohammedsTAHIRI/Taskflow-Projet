<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tableau de bord - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <span class="brand">TaskFlow</span>
    <div style="display:flex;align-items:center;gap:.5rem">
      <span id="user-display"></span>
      <a href="projects.html">Mes Projets</a>
      <div class="notif-wrapper">
        <button class="notif-bell" onclick="toggleNotifDropdown()" aria-label="Notifications">🔔<span id="notif-badge"></span></button>
        <div id="notif-dropdown" style="display:none"><div id="notif-list"></div></div>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Mode clair/sombre">☀️</button>
      <button id="logout-btn">Déconnexion</button>
    </div>
  </nav>

  <div class="dashboard">
    <h1 style="margin-bottom:1.5rem;color:var(--light)">Tableau de bord</h1>

    <div class="metrics">
      <div class="metric-card">
        <h2 id="active-projects">—</h2>
        <p>Projets actifs</p>
      </div>
      <div class="metric-card">
        <h2 id="assigned-tasks">—</h2>
        <p>Tâches assignées</p>
      </div>
      <div class="metric-card">
        <h2 id="completed-tasks">—</h2>
        <p>Tâches terminées</p>
      </div>
      <div class="metric-card late">
        <h2 id="late-tasks">—</h2>
        <p>Tâches en retard</p>
      </div>
    </div>

    <div class="tasks-section">
      <h2>Tâches en cours (date limite ↑, priorité ↓)</h2>
      <div id="ongoing-tasks"><em style="color:var(--text-muted)">Chargement...</em></div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
