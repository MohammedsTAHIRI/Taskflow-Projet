<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tableau de bord - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dashboard { max-width: 1000px; margin: 5rem auto 2rem; padding: 1rem; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .metric-card { background: white; padding: 1.5rem; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .metric-card h2 { font-size: 2.5rem; margin: 0; color: #667eea; }
    .metric-card p { margin: 0.5rem 0 0; color: #666; }
    .metric-card.late h2 { color: #dc3545; }
    .tasks-section { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .tasks-section h2 { margin-bottom: 1rem; color: #333; }
    .task-item { display: flex; justify-content: space-between; padding: 0.8rem; border-bottom: 1px solid #eee; }
    .task-item:last-child { border-bottom: none; }
    .priority-haute { color: #dc3545; font-weight: bold; }
    .priority-moyenne { color: #ffc107; font-weight: bold; }
    .priority-basse { color: #28a745; font-weight: bold; }
    nav a { color: #667eea; text-decoration: none; margin-right: 1rem; font-weight: 500; }
    nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav>
    <span id="user-display"></span>
    <div>
      <a href="projects.html">Mes Projets</a>
      <button id="logout-btn">Déconnexion</button>
    </div>
  </nav>

  <div class="dashboard">
    <h1>Tableau de bord</h1>
    
    <div class="metrics">
      <div class="metric-card">
        <h2 id="active-projects">0</h2>
        <p>Projets actifs</p>
      </div>
      <div class="metric-card">
        <h2 id="assigned-tasks">0</h2>
        <p>Tâches assignées</p>
      </div>
      <div class="metric-card">
        <h2 id="completed-tasks">0</h2>
        <p>Tâches terminées</p>
      </div>
      <div class="metric-card late">
        <h2 id="late-tasks">0</h2>
        <p>Tâches en retard</p>
      </div>
    </div>

    <div class="tasks-section">
      <h2>Tâches en cours (priorité ↓)</h2>
      <div id="ongoing-tasks"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
