<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tâches - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <span class="brand">TaskFlow</span>
    <div style="display:flex;align-items:center;gap:.5rem">
      <span id="user-display"></span>
      <a href="index.html">Dashboard</a>
      <a href="projects.html">Projets</a>
      <div class="notif-wrapper">
        <button class="notif-bell" onclick="toggleNotifDropdown()" aria-label="Notifications">🔔<span id="notif-badge"></span></button>
        <div id="notif-dropdown" style="display:none"><div id="notif-list"></div></div>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Mode clair/sombre">☀️</button>
      <button id="logout-btn">Déconnexion</button>
    </div>
  </nav>

  <div class="section">
    <h1 style="color:var(--light);margin-bottom:1.2rem">Tâches du projet</h1>

    <!-- Membres -->
    <div class="card" id="members-section">
      <h3>👥 Membres</h3>
      <div id="members-list" class="mt-1"><em class="text-muted">Chargement...</em></div>
      <div class="invite-row mt-2" id="invite-row" style="display:none">
        <input type="email" id="invite-email" placeholder="Email à inviter">
        <button onclick="inviteMember()">Inviter</button>
      </div>
    </div>

    <!-- Formulaire nouvelle tâche (owner seulement) -->
    <div class="card" id="task-form-section" style="display:none">
      <h3>➕ Nouvelle tâche</h3>
      <form id="task-form" class="mt-1">
        <div class="form-group">
          <label>Titre *</label>
          <input type="text" id="task-title" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="task-description" rows="2"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Priorité *</label>
            <select id="task-priority">
              <option value="basse">Basse</option>
              <option value="moyenne" selected>Moyenne</option>
              <option value="haute">Haute</option>
            </select>
          </div>
          <div class="form-group">
            <label>Assigner à</label>
            <select id="assignedTo"><option value="">-- Non assigné --</option></select>
          </div>
        </div>
        <div class="form-group">
          <label>📅 Date limite *</label>
          <input type="date" id="task-dueDate" required>
        </div>
        <button type="submit">Créer la tâche</button>
      </form>
    </div>

    <!-- Filtrage & Recherche -->
    <div class="card">
      <h3>🔍 Filtrer les tâches</h3>
      <div class="filter-row mt-1">
        <div class="form-group">
          <label>Recherche</label>
          <input type="text" id="filter-search" placeholder="Titre ou description...">
        </div>
        <div class="form-group">
          <label>Statut</label>
          <select id="filter-status">
            <option value="">Tous</option>
            <option value="à faire">À faire</option>
            <option value="en cours">En cours</option>
            <option value="terminé">Terminé</option>
          </select>
        </div>
        <div class="form-group">
          <label>Priorité</label>
          <select id="filter-priority">
            <option value="">Toutes</option>
            <option value="haute">Haute</option>
            <option value="moyenne">Moyenne</option>
            <option value="basse">Basse</option>
          </select>
        </div>
        <div class="form-group">
          <label>Membre</label>
          <select id="filter-member"><option value="">Tous</option></select>
        </div>
        <div class="form-group" style="display:flex;align-items:flex-end">
          <button id="filter-reset" class="btn-outline" style="width:100%">↺ Réinitialiser</button>
        </div>
      </div>
    </div>

    <!-- Fil d'activité -->
    <div class="card" id="activity-section">
      <h3>📋 Historique des activités</h3>
      <div id="activity-feed" class="mt-1"><em class="text-muted">Chargement...</em></div>
    </div>

    <!-- Liste des tâches -->
    <div id="tasks-list"><em class="text-muted">Chargement...</em></div>
    <div id="pagination"></div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/activities.js"></script>
  <script>
    async function loadMembersList() {
      const projectId = new URLSearchParams(window.location.search).get('project');
      if (!projectId) return;
      try {
        const [members, project] = await Promise.all([
          api.request(`/projects/${projectId}/members`),
          api.request(`/projects/${projectId}`)
        ]);
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        const isOwner = project.owner._id === user?.id || project.owner === user?.id;
        if (isOwner) {
          document.getElementById('task-form-section').style.display = 'block';
          document.getElementById('invite-row').style.display = 'flex';
        }
        document.getElementById('members-list').innerHTML = members.map(m => `
          <div class="member-item">
            <span>👤 <strong>${m.fullName}</strong> — ${m.email}
              <small class="text-muted">(${m.role === 'owner' ? 'Créateur' : 'Membre'})</small>
            </span>
            ${isOwner && m.role !== 'owner'
              ? `<button class="btn-danger" style="padding:.3rem .7rem;font-size:.8rem" onclick="removeMember('${projectId}','${m._id}')">Retirer</button>`
              : ''}
          </div>
        `).join('');
      } catch (err) { console.error(err); }
    }

    async function inviteMember() {
      const email = document.getElementById('invite-email').value.trim();
      const projectId = new URLSearchParams(window.location.search).get('project');
      if (!email) return alert('Entrez un email');
      try {
        const res = await api.request(`/projects/${projectId}/members`, { method: 'POST', body: JSON.stringify({ email }) });
        alert(res.message);
        document.getElementById('invite-email').value = '';
        await loadMembersList();
        if (window.loadMembers) await loadMembers();
      } catch (err) { alert(err.message); }
    }

    async function removeMember(projectId, memberId) {
      if (!confirm('Retirer ce membre ?')) return;
      try {
        const res = await api.request(`/projects/${projectId}/members/${memberId}`, { method: 'DELETE' });
        alert(res.message);
        await loadMembersList();
      } catch (err) { alert(err.message); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadMembersList();
      const projectId = new URLSearchParams(window.location.search).get('project');
      if (projectId) loadActivities(projectId);
    });
  </script>
  <script src="js/notifications.js"></script>
</body>
</html>
