<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body class="auth-page">
  <button class="theme-toggle theme-toggle-fixed" onclick="toggleTheme()" title="Mode clair/sombre">☀️</button>
  <div class="container">
    <h1>TaskFlow</h1>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Mot de passe" required minlength="6">
      <button type="submit">Se connecter</button>
    </form>
    <p>Pas de compte ? <a href="register.html">S'inscrire</a></p>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
